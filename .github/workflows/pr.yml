# What happens to a pull request. Nothing here leaves the runner.
name: PR

on:
  pull_request:

# A superseded pull-request run is wasted compute and nothing else, so cancel it.
# `release.yml` deliberately does the opposite.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  browser:
    needs: verify
    uses: ./.github/workflows/browser.yml

  # Whether this pull request owes the changelog a sentence. The version number
  # is never contested — a changeset declares a bump *kind*, in a file named
  # after two random words, so ten parallel branches write ten different files
  # and `release.yml` folds them into one number afterwards. What IS contestable
  # is silence: a change to the library that carries no changeset still ships,
  # inside whatever version the next changeset happens to produce, and the
  # CHANGELOG then describes a release that did more than it says.
  #
  # Scoped to the library's own source, because the repository's rule is that
  # the docs site, CI and tests need no changeset. A refactor under `src` that
  # genuinely changes nothing a consumer can observe gets the `skip-changeset`
  # label — the escape hatch is a deliberate act, not a default.
  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changeset for a consumer-visible change
        env:
          BASE: ${{ github.base_ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          changed=$(git diff --name-only "origin/${BASE}...HEAD")

          library=$(echo "$changed" | grep '^packages/design/src/' | grep -v '/__tests__/' || true)
          if [ -z "$library" ]; then
            echo "No change under packages/design/src — no changeset owed."
            exit 0
          fi

          # README.md and config.json are the directory's furniture, not pending
          # changesets, so they do not answer for one.
          added=$(echo "$changed" | grep '^\.changeset/.*\.md$' | grep -v '/README\.md$' || true)
          if [ -n "$added" ]; then
            echo "Changeset present:"; echo "$added"
            exit 0
          fi

          if [ "$SKIP" = "true" ]; then
            echo "Library changed with no changeset, waived by the skip-changeset label."
            exit 0
          fi

          echo "This pull request changes the library but adds no changeset:"
          echo "$library"
          echo
          echo "Run 'pnpm changeset' and commit the file, or add the"
          echo "'skip-changeset' label if no consumer can observe the change."
          exit 1
