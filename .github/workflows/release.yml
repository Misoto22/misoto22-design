name: Release

on:
  push:
    branches: [main]

# One release at a time, and never cancelled: a half-published package is worse
# than a late one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          # Writes the `.npmrc` that `changeset publish` authenticates with, so
          # NODE_AUTH_TOKEN below is the credential and nothing on disk holds a
          # value. The package is public under a scope, which npm treats as
          # restricted unless told otherwise — `publishConfig.access` says so.
          registry-url: https://registry.npmjs.org
          scope: '@misoto22'

      - run: pnpm install --frozen-lockfile

      # The gates the package is released against are the same ones CI runs, and
      # they run again here rather than trusting a green check on a different
      # commit.
      - run: pnpm lint
      - run: pnpm build:design
      - run: pnpm typecheck
      - run: pnpm test

      # Opens (or updates) a "Version Packages" pull request while changesets
      # are pending, and publishes once that PR is merged and none are left.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # Two different credentials: GITHUB_TOKEN opens the version pull
          # request, NPM_TOKEN publishes. The workflow's own token cannot reach
          # npmjs, so a missing NPM_TOKEN fails the publish rather than
          # silently shipping nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The action decides whether anything shipped by PARSING the publish CLI's
      # human-readable output, and does not recognise this CLI version's
      # wording — so after a successful publish it reported nothing and pushed
      # no tags. Read the fact instead of a parse of it: `changeset tag` creates
      # a tag per package at whatever version package.json now holds, and skips
      # any that already exist, so this is idempotent on every other push.
      - name: Tag what was published
        run: |
          set -euo pipefail
          pnpm exec changeset tag
          git push origin --tags
          echo "version: $(node -p "require('./packages/design/package.json').version")"
