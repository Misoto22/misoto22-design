# The half that needs a rendering engine. Separate from `verify` because it
# downloads a browser and takes longer, and because a failure here says
# something different: not "the code is wrong" but "the rendered page is wrong".
name: Browser

on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install Chromium
        run: pnpm --filter @misoto22/design-docs exec playwright install --with-deps chromium

      # The suite serves the built export, so it tests the artifact that ships
      # rather than a dev server that renders through a different pipeline.
      - name: Download the static export
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-out
          path: apps/docs/out

      - name: Accessibility and keyboard suite
        run: pnpm --filter @misoto22/design-docs test:e2e

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/docs/playwright-report
          retention-days: 7
