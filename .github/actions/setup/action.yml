# The four lines every job in this repository starts with. They were copied
# into each job before, which is how a Node version drifts between two of them
# without anyone noticing.
#
# Checkout stays in the caller: a job that needs `fetch-depth: 0` should say so
# where it is read, not through an input on this action.
name: Set up pnpm and Node
description: Installs pnpm and Node, restores the pnpm cache, and installs the workspace.

inputs:
  registry-url:
    description: >-
      Registry to write into `.npmrc`. Only the publishing job needs this; it is
      what points `changeset publish` at npmjs.
    required: false
    default: ''
  scope:
    description: Package scope to associate with the registry above.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Reads the version from `packageManager` in package.json, so pnpm is pinned
    # by the same field that pins it locally.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - run: pnpm install --frozen-lockfile
      shell: bash
