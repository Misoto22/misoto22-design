<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="misoto22 design">
  <title>misoto22 design</title>
  <!-- Law 2 made into a mark: a shadow in this system is never blurred, so the
       plate below is a solid offset shape rather than a gradient. -->
  <rect x="11" y="11" width="17" height="17" rx="3" fill="#101010" />
  <rect x="4" y="4" width="17" height="17" rx="3" fill="#ffffff" stroke="#101010" stroke-width="2" />
</svg>
